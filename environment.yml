# Environment for the RA-HPO solver and for gprMax, which produces the reference planes and the
# full-domain reference solutions.
#
# Two pins are needed by gprMax. Its Cython sources target the NumPy-1 C API, so a NumPy-2
# build fails to compile, and its setup.py imports distutils, which Python 3.12 removed.
# environment-analysis.yml is a separate, newer stack for the figure and metric scripts.
#
# gprMax (version 3.1.7) is not installed from conda. Clone it, then from its root, with this
# environment active:
#     CC=gcc CXX=g++ python setup.py build
#     pip install -e . --no-build-isolation
# --no-build-isolation is required because setup.py imports NumPy without declaring it.
# setup.py compiles with -march=native, so build on a machine no newer than the one that runs
# the simulations. Use the same GCC at build and at run time, so that the OpenMP runtime
# (libgomp) is consistent. The results of the paper were computed with GCC 13.4.0.
name: rahpo
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy<2          # gprMax Cython targets the NumPy-1 C API
  - cython<3         # NumPy-1 C API codegen
  - scipy
  - matplotlib
  - h5py
  - joblib           # element-level parallelism in ra_hpo.py
  - psutil
  - colorama
  - setuptools
  - wheel
  - pip
  - pip:
      - terminaltables   # gprMax runtime dependency, pip-only
      - tqdm             # gprMax runtime dependency, pip-only
